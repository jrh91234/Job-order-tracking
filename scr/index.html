<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Scanner V.24 (Force Left-to-Right Date)</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
      body { background-color: #f3f6f9; color: #334155; font-family: 'Sarabun', sans-serif; padding-bottom: 250px; }
      .container { max-width: 600px; margin-top: 30px; }
      h4 { font-weight: 600; color: #1e293b; letter-spacing: -0.5px; }

      .batch-item { 
        position: relative; background: #ffffff; border: 1px solid #e2e8f0;
        border-radius: 16px; padding: 20px; margin-bottom: 20px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
        border-left: 5px solid #cbd5e1; transition: all 0.3s ease;
      }
      .batch-item.processing { border-left-color: #3b82f6; background-color: #eff6ff; }
      .batch-item.success { border-left-color: #10b981; }
      .batch-item.warning { border-left-color: #f59e0b; }
      .batch-item.error { border-left-color: #ef4444; }
      
      .thumb-img { 
        width: 70px; height: 70px; object-fit: cover; 
        border-radius: 12px; border: 1px solid #e2e8f0; 
        cursor: pointer; transition: transform 0.2s;
        display: flex; align-items: center; justify-content: center; background: #f8fafc; font-size: 2rem;
      }
      .thumb-img:hover { transform: scale(1.05); border-color: #3b82f6; }
      
      .btn-remove { 
        position: absolute; top: 10px; right: 15px; z-index: 100;
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
        color: #94a3b8; background: rgba(255, 255, 255, 0.9); 
        border: 1px solid #e2e8f0; border-radius: 50%;
        font-size: 1.5rem; line-height: 1; cursor: pointer; transition: 0.2s;
      }
      .btn-remove:hover { color: #ef4444; background: #fee2e2; border-color: #ef4444; transform: scale(1.1); }

      .btn-scan-area {
        background-color: #ffffff; border: 2px dashed #cbd5e1; border-radius: 16px;
        color: #64748b; transition: all 0.2s;
      }
      .btn-scan-area:hover { border-color: #3b82f6; background-color: #eff6ff; color: #3b82f6; }
      
      .score-badge {
        font-size: 0.85em; padding: 1px 6px; border-radius: 4px;
        color: white; font-weight: bold; float: right; min-width: 35px; text-align: center;
      }
      .score-high { background-color: #10b981; } 
      .score-med { background-color: #f59e0b; }  
      .score-low { background-color: #ef4444; }  

      .fixed-bottom-bar { 
        position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 10px 30px 10px; 
        pointer-events: none; display: flex; justify-content: center; z-index: 1000; 
        background: linear-gradient(to top, #ffffff 80%, transparent);
      }
      .fixed-bottom-bar button { pointer-events: auto; }
      .field-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-bottom: 4px; display: block; }

      #previewTable table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      #previewTable th, #previewTable td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
      #previewTable th { background-color: #f8f9fa; font-weight: bold; position: sticky; top: 0; }
    </style>
  </head>
  <body>

    <div class="container">
      <div class="text-center mb-4">
        <h4>DRIVE SCANNER <span style="font-size:0.6em; color:#94a3b8; font-weight:400;">V.24</span></h4>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <button class="btn btn-scan-area w-100 p-3" onclick="document.getElementById('cameraInput').click()">
            <div class="h3 mb-1">📸</div>
            <span class="small fw-bold">ถ่ายรูป</span>
          </button>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple class="d-none" onchange="addFilesToQueue(this)">
        </div>

        <div class="col-6">
          <button class="btn btn-scan-area w-100 p-3" onclick="document.getElementById('uploadInput').click()">
            <div class="h3 mb-1">📂</div>
            <span class="small fw-bold">เลือกไฟล์</span>
          </button>
          <input type="file" id="uploadInput" accept="image/*, .xlsx, .xls" multiple class="d-none" onchange="addFilesToQueue(this)">
        </div>
      </div>

      <div id="queueList"></div>
      <div class="text-center mt-5" id="emptyMsg">
        <div style="font-size: 3rem; opacity: 0.1;">📂</div>
        <small class="text-muted">ยังไม่มีรายการ</small>
      </div>
    </div>

    <div class="fixed-bottom-bar">
      <div class="d-flex gap-2 w-100 px-3 shadow-sm bg-white rounded-pill border p-2 mb-4" style="max-width: 500px;">
        <button id="btnClear" class="btn btn-light text-danger fw-bold rounded-pill px-3" onclick="clearAll()" disabled>ล้าง</button>
        <button id="btnAction" class="btn btn-secondary flex-grow-1 fw-bold" onclick="handleMainButton()" disabled>⌛ รอไฟล์...</button>
      </div>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0 p-2 position-absolute top-0 end-0" style="z-index: 1056;">
            <button type="button" class="btn-close btn-close-white bg-dark p-2 rounded-circle shadow" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0 text-center d-flex justify-content-center bg-dark" style="min-height: 300px; max-height: 90vh; overflow: auto; align-items: flex-start;">
            <img id="previewImage" src="" class="img-fluid d-none" style="max-height: 90vh;">
            <div id="previewTable" class="w-100 h-100 bg-white d-none text-dark text-start p-3" style="min-height: 300px; overflow: auto;">
                <div class="text-center text-muted my-5">Loading Excel...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let queue = [];
      let isWorkerRunning = false; 
      let isRevealMode = false;    
      let previewModalInstance = null;

      function addFilesToQueue(inputElement) {
        if (!inputElement.files.length) return;
        document.getElementById('emptyMsg').style.display = 'none';
        Array.from(inputElement.files).forEach((file) => {
          const id = Date.now() + Math.random().toString(36).substr(2, 5);
          const item = { id, file, status_internal: 'pending', result_data: null, retry_count: 0 };
          queue.push(item);
          renderItem(item);
        });
        updateUI();
        inputElement.value = ""; 
        if (!isWorkerRunning) runSecretWorker();
      }

      function previewFile(itemId) {
        const item = queue.find(i => i.id === itemId);
        if (!item) return;
        const modalEl = document.getElementById('previewModal');
        const imgEl = document.getElementById('previewImage');
        const tableEl = document.getElementById('previewTable');
        if (!previewModalInstance) previewModalInstance = new bootstrap.Modal(modalEl);

        imgEl.classList.add('d-none');
        tableEl.classList.add('d-none');
        tableEl.innerHTML = '<div class="text-center text-muted my-5"><span class="spinner-border text-primary"></span> กำลังโหลดข้อมูล...</div>';

        if (item.file.type.includes('image')) {
            const reader = new FileReader();
            reader.onload = e => { imgEl.src = e.target.result; imgEl.classList.remove('d-none'); };
            reader.readAsDataURL(item.file);
        } else {
            tableEl.classList.remove('d-none');
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const html = XLSX.utils.sheet_to_html(worksheet, { id: "excel-table", editable: false });
                    tableEl.innerHTML = html;
                } catch (err) {
                    tableEl.innerHTML = `<div class="text-danger text-center p-4">❌ ไม่สามารถอ่านไฟล์นี้ได้<br><small>${err}</small></div>`;
                }
            };
            reader.readAsArrayBuffer(item.file);
        }
        previewModalInstance.show();
      }

      async function runSecretWorker() {
        isWorkerRunning = true;
        while(true) {
            const pendingItems = queue.filter(i => i.status_internal === 'pending');
            if (pendingItems.length === 0) break;
            const batch = pendingItems.slice(0, 1); 
            batch.forEach(item => item.status_internal = 'processing');
            if (isRevealMode) batch.forEach(item => updateItemVisuals(item));
            await processSingleItem(batch[0]);
            if (queue.some(i => i.status_internal === 'pending')) await new Promise(r => setTimeout(r, 1000));
        }
        isWorkerRunning = false;
        updateUI();
      }

      function processSingleItem(item) {
        return new Promise((resolve) => {
          if (!queue.find(q => q.id === item.id)) { resolve(); return; }
          const reader = new FileReader();
          
          // ⭐ 1. Excel Handling
          const lowerName = item.file.name.toLowerCase();
          if (item.file.type.includes('spreadsheet') || lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) {
             reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                let textOutput;
                const smartParsed = tryParseProductionOrder(worksheet);
                if (smartParsed) {
                    textOutput = buildStructuredText(smartParsed);
                } else {
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, {
                        header: 1,
                        raw: false,
                        dateNF: 'dd/mm/yyyy'
                    });
                    const textArray = jsonData.map(row => row.map(cell => forceThaiDateParser(cell)).join(" "));
                    textOutput = textArray.join("\n");
                }

                const base64 = btoa(unescape(encodeURIComponent(textOutput)));
                sendToBackend(item, base64, 'text/plain', resolve);
             };
             reader.readAsArrayBuffer(item.file);
          } 
          // ⭐ 2. Image Handling
          else {
             reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                   const canvas = document.createElement('canvas');
                   const ctx = canvas.getContext('2d');
                   const MAX_DIMENSION = 1000; 
                   let scale = 1;
                   if (Math.max(img.width, img.height) > MAX_DIMENSION) scale = MAX_DIMENSION / Math.max(img.width, img.height);
                   canvas.width = img.width * scale;
                   canvas.height = img.height * scale;
                   ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                   const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                   sendToBackend(item, base64, 'image/jpeg', resolve);
                }
             };
             reader.readAsDataURL(item.file);
          }
        });
      }

      // ⭐ ฟังก์ชันกฎเหล็ก: รับข้อความมา แล้วบังคับอ่านซ้ายไปขวา
      // Input: "5/2/2026" -> Output: "05/02/2026"
      // Input: "05-02-26" -> Output: "05/02/2026"
      function forceThaiDateParser(cellValue) {
         if (typeof cellValue !== 'string') return cellValue;
         
         // ค้นหา pattern d/m/y หรือ d-m-y
         const match = cellValue.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
         if (match) {
             let d = parseInt(match[1]); // ตัวแรกคือวัน (dd)
             let m = parseInt(match[2]); // ตัวสองคือเดือน (mm)
             let y = parseInt(match[3]); // ตัวสามคือปี (yyyy)

             // แก้ปี 2 หลัก (เช่น 26 -> 2026)
             if (y < 100) y += 2000;
             // แก้ปี พ.ศ. (เช่น 2569 -> 2026)
             if (y > 2400) y -= 543;

             return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
         }
         return cellValue;
      }

      // ⭐ ตรวจสอบว่าไฟล์ Excel นี้เป็น "ใบสั่งผลิต" (生产订单) หรือไม่
      // ถ้าใช่ → อ่านค่าจากเซลล์โดยตรง แล้วส่งเป็น text ที่ backend parse ได้ถูกต้อง
      function tryParseProductionOrder(worksheet) {
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
          const allText = jsonData.map(r => r.join(' ')).join('\n');
          if (!allText.includes('单据编号') && !allText.includes('生产订单')) return null;

          let jobOrder = '', issueDate = '', finishDate = '', model = '', qty = '';

          for (let r = 0; r < jsonData.length; r++) {
              const row = jsonData[r];

              for (let c = 0; c < row.length; c++) {
                  const cell = String(row[c] || '').trim();
                  const jobMatch = cell.match(/TH-SCDD\d+/);
                  if (jobMatch && !jobOrder) jobOrder = jobMatch[0];

                  if ((cell === '日期:' || cell === '日期') && !issueDate) {
                      for (let cc = c + 1; cc < row.length; cc++) {
                          const v = String(row[cc] || '').trim();
                          if (v) { issueDate = convertToEUDate(v); break; }
                      }
                  }
              }

              const rowStr = row.join('|');
              if (rowStr.includes('规格型号') && rowStr.includes('数量') && rowStr.includes('计划完工时间')) {
                  let modelCol = -1, qtyCol = -1, finishCol = -1;
                  row.forEach((cell, c) => {
                      const v = String(cell || '').trim();
                      if (v.includes('规格型号')) modelCol = c;
                      if (v === '数量' || (v.includes('数量') && !v.includes('计划'))) qtyCol = c;
                      if (v.includes('计划完工时间')) finishCol = c;
                  });
                  for (let dr = r + 1; dr < jsonData.length; dr++) {
                      const dataRow = jsonData[dr];
                      if (!dataRow || !dataRow.some(c => String(c || '').trim())) break;
                      if (modelCol >= 0 && dataRow[modelCol]) model = String(dataRow[modelCol]).trim();
                      if (qtyCol >= 0 && dataRow[qtyCol]) qty = String(dataRow[qtyCol]).trim().replace(/\.0+$/, '');
                      if (finishCol >= 0 && dataRow[finishCol]) finishDate = convertToEUDate(String(dataRow[finishCol]).trim().split(' ')[0]);
                      break;
                  }
                  break;
              }
          }

          if (!jobOrder && !model) return null;
          return { jobOrder, issueDate, finishDate, model, qty };
      }

      // แปลง yyyy/m/d → dd/mm/yyyy
      function convertToEUDate(dateStr) {
          if (!dateStr) return '';
          const m = dateStr.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
          if (m) return `${String(parseInt(m[3])).padStart(2,'0')}/${String(parseInt(m[2])).padStart(2,'0')}/${m[1]}`;
          return dateStr;
      }

      // สร้าง structured text ที่ backend parse ได้แม่นยำ
      function buildStructuredText(p) {
          const lines = [];
          if (p.jobOrder) lines.push(p.jobOrder);
          if (p.issueDate) lines.push(`DATE: ${p.issueDate}`);
          if (p.finishDate) lines.push(`FINISH: ${p.finishDate}`);
          if (p.model) lines.push(`MODEL: ${p.model}`);
          if (p.qty) lines.push(`Qty ${p.qty}`);
          return lines.join('\n');
      }

      function sendToBackend(item, base64, mimeType, resolve) {
          google.script.run
            .withSuccessHandler(data => {
                if(data.error) handleError(item, data.error, resolve);
                else {
                   item.status_internal = 'done';
                   item.result_data = data;
                   updateItemVisuals(item);
                   updateUI();
                   resolve();
                }
            })
            .withFailureHandler(err => handleError(item, err.message, resolve))
            .processFileWithDrive(base64, mimeType); 
      }

      function handleError(item, errorMsg, resolve) {
          if (item.retry_count < 1) { 
              item.retry_count++;
              item.status_internal = 'pending'; 
              if (isRevealMode) {
                 const status = document.getElementById(`status-${item.id}`);
                 if(status) status.innerHTML = `<span class="spinner-border spinner-border-sm text-warning"></span> ลองใหม่ (${item.retry_count})...`;
              }
          } else {
              item.status_internal = 'error';
              item.error_msg = errorMsg;
              updateItemVisuals(item);
          }
          updateUI();
          resolve();
      }

      function handleMainButton() {
          const hasError = queue.some(i => i.status_internal === 'error');
          const allDone = queue.length > 0 && queue.every(i => i.status_internal === 'done' || i.status_internal === 'error');
          if (allDone) { saveAllToSheet(); return; }
          if (hasError) { retryFailedItems(); return; }
          isRevealMode = true; 
          queue.forEach(item => updateItemVisuals(item));
          if (!isWorkerRunning) runSecretWorker();
          updateUI();
      }

      function updateItemVisuals(item) {
          const el = document.getElementById(`item-${item.id}`);
          const status = document.getElementById(`status-${item.id}`);
          const errorDiv = document.getElementById(`error-${item.id}`);
          if (!el) return;
          if (!isRevealMode) { status.innerHTML = '⏳ รอคำสั่งเริ่ม...'; return; }
          if (item.status_internal === 'processing') {
              el.className = 'batch-item processing';
              status.innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span> กำลังวิเคราะห์...';
          } 
          else if (item.status_internal === 'done') {
              fillFormData(item, item.result_data);
          }
          else if (item.status_internal === 'error') {
              el.className = 'batch-item error';
              status.innerHTML = '❌ ผิดพลาด';
              status.className = 'small fw-bold text-danger mb-2';
              errorDiv.classList.remove('d-none');
              errorDiv.innerText = item.error_msg || 'Error';
          }
      }

      function fillFormData(item, data) {
          const el = document.getElementById(`item-${item.id}`);
          const status = document.getElementById(`status-${item.id}`);
          const form = document.getElementById(`form-${item.id}`);
          const modelInput = document.getElementById(`model-${item.id}`);
          const getBadge = (score) => {
             if (!score) return '';
             let colorClass = score > 80 ? 'score-high' : (score > 50 ? 'score-med' : 'score-low');
             return `<span class="score-badge ${colorClass}">${score}%</span>`;
          };
          if (data.matchType === 'exact') {
            el.className = 'batch-item success';
            status.innerHTML = '✅ เรียบร้อย';
            status.className = 'small fw-bold text-success mb-2';
          } else if (data.matchType === 'fuzzy') {
            el.className = 'batch-item warning';
            modelInput.classList.add('input-fuzzy'); 
            status.innerHTML = '⚠️ แก้ไขชื่ออัตโนมัติ';
            status.className = 'small fw-bold text-warning mb-2';
          } else {
            status.innerHTML = '⚠️ ตรวจสอบข้อมูล';
            status.className = 'small fw-bold text-secondary mb-2';
          }
          form.classList.remove('d-none');
          document.getElementById(`job-${item.id}`).value = data.jobOrder || '';
          updateLabel(item.id, 'job', '📌 JOB', data.scores?.job);
          document.getElementById(`qty-${item.id}`).value = data.planQty || '';
          updateLabel(item.id, 'qty', '🔢 QTY', data.scores?.qty);
          modelInput.value = data.matchedModel || '';
          updateLabel(item.id, 'model', '📦 MODEL', data.scores?.model);
          let dateStart = formatDateForInput(data.issueDate);
          let dateFinish = formatDateForInput(data.finishDate);
          if (dateStart && dateFinish && dateStart > dateFinish) { let temp = dateStart; dateStart = dateFinish; dateFinish = temp; }
          document.getElementById(`issue-${item.id}`).value = dateStart;
          document.getElementById(`finish-${item.id}`).value = dateFinish;
          updateLabel(item.id, 'issue', '📅 START', data.scores?.date);
      }

      function updateLabel(itemId, fieldName, originalText, score) {
          const input = document.getElementById(`${fieldName}-${itemId}`);
          if(input) {
              const label = input.previousElementSibling; 
              if(label && label.classList.contains('field-label')) {
                  let badgeHtml = score !== undefined ? `<span class="score-badge ${score > 80 ? 'score-high' : (score > 50 ? 'score-med' : 'score-low')}">${score}%</span>` : '';
                  label.innerHTML = `${originalText} ${badgeHtml}`;
              }
          }
      }

      function removeItem(id) {
        queue = queue.filter(i => i.id !== id);
        document.getElementById(`item-${id}`)?.remove();
        updateUI();
      }
      
      function clearAll() { 
        if(confirm("ล้างรายการทั้งหมด?")) { queue = []; document.getElementById('queueList').innerHTML = ''; isRevealMode = false; updateUI(); } 
      }
      
      function saveAllToSheet() {
        const btn = document.getElementById('btnAction');
        const validItems = queue.filter(i => i.status_internal === 'done' && i.result_data);
        if (validItems.length === 0) { alert("ไม่มีข้อมูลให้บันทึก"); return; }
        btn.innerHTML = '⏳ กำลังบันทึก...'; btn.disabled = true;
        const payload = validItems.map(item => ({
          jobOrder: document.getElementById(`job-${item.id}`).value,
          matchedModel: document.getElementById(`model-${item.id}`).value,
          planQty: document.getElementById(`qty-${item.id}`).value,
          issueDate: document.getElementById(`issue-${item.id}`).value,
          finishDate: document.getElementById(`finish-${item.id}`).value
        }));
        google.script.run.withSuccessHandler(msg => {
            if(confirm(msg + "\nล้างรายการหรือไม่?")) { queue = []; document.getElementById('queueList').innerHTML = ''; isRevealMode = false; updateUI(); } else { updateUI(); }
        }).withFailureHandler(err => { alert("Save Failed: " + err); updateUI(); }).saveBatchToSheet(payload);
      }

      function formatDateForInput(dateStr) {
        if (!dateStr) return '';
        dateStr = dateStr.trim();
        const parts = dateStr.split(/[\/\-\.]/); 
        if (parts.length === 3) {
          let p1 = parts[0];
          let p2 = parts[1];
          let p3 = parts[2];
          let day, month, year;
          if (p1.length === 4) { year = parseInt(p1); month = p2; day = p3; } 
          else { day = p1; month = p2; year = parseInt(p3); }
          if (year > 2400) year -= 543; 
          return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
        }
        return ''; 
      }

      function renderItem(item) {
        const div = document.createElement('div');
        div.id = `item-${item.id}`;
        div.className = 'batch-item';
        let thumbContent = '';
        if (item.file.type.includes('image')) {
             thumbContent = `<img id="img-${item.id}" class="thumb-img mt-1">`;
             const reader = new FileReader();
             reader.onload = e => document.getElementById(`img-${item.id}`).src = e.target.result;
             reader.readAsDataURL(item.file);
        } else {
             thumbContent = `<div class="thumb-img mt-1" style="color:#10b981;">📊</div>`;
        }
        div.innerHTML = `
          <button class="btn-remove" onclick="removeItem('${item.id}')">×</button>
          <div class="d-flex gap-3 align-items-start">
            <div onclick="previewFile('${item.id}')">
               ${thumbContent}
            </div>
            <div class="flex-grow-1">
              <div id="status-${item.id}" class="fw-bold text-muted mb-2 small">⏳ รอคำสั่งเริ่ม...</div>
              <div id="form-${item.id}" class="d-none">
                <div class="row g-2 mb-2">
                  <div class="col-8"><span class="field-label">📌 JOB</span><input type="text" class="form-control form-control-sm" id="job-${item.id}"></div>
                  <div class="col-4"><span class="field-label">🔢 QTY</span><input type="number" class="form-control form-control-sm text-center fw-bold" style="color:#f59e0b;" id="qty-${item.id}"></div>
                </div>
                <div class="mb-2"><span class="field-label">📦 MODEL</span><input type="text" class="form-control form-control-sm" id="model-${item.id}"></div>
                <div class="row g-2">
                  <div class="col-6"><span class="field-label">📅 START</span><input type="date" class="form-control form-control-sm text-center" id="issue-${item.id}"></div>
                  <div class="col-6"><span class="field-label">🏁 FINISH</span><input type="date" class="form-control form-control-sm text-center" id="finish-${item.id}"></div>
                </div>
              </div>
              <div id="error-${item.id}" class="text-danger small d-none mt-2 fw-bold bg-danger-subtle p-1 rounded"></div>
            </div>
          </div>
        `;
        document.getElementById('queueList').appendChild(div);
      }

      function updateUI() {
        const hasItems = queue.length > 0;
        const allDone = queue.length > 0 && queue.every(i => i.status_internal === 'done' || i.status_internal === 'error');
        const btn = document.getElementById('btnAction');
        document.getElementById('btnClear').disabled = false;
        
        if (queue.length === 0) {
            document.getElementById('emptyMsg').style.display = 'block';
            btn.innerHTML = '⏳ รอไฟล์...'; btn.className = "btn btn-secondary flex-grow-1 fw-bold"; btn.disabled = true; isRevealMode = false; return;
        }
        if (allDone && isRevealMode) {
             btn.innerHTML = `💾 บันทึกข้อมูล`; btn.className = "btn btn-success flex-grow-1 fw-bold text-white"; btn.style.backgroundColor = "#10b981"; btn.disabled = false;
        } else if (isRevealMode) {
             btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังประมวลผล...'; btn.className = "btn btn-secondary flex-grow-1 fw-bold"; btn.disabled = true;
        } else {
             btn.innerHTML = `🚀 เริ่มประมวลผล (${queue.length})`; btn.className = "btn btn-primary flex-grow-1 fw-bold"; btn.style.backgroundColor = ""; btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
